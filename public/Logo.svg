<svg width="680" height="240" viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg">

  <!-- Outer hex fill -->
  <polygon points="130,42 172,66 172,114 130,138 88,114 88,66"
           fill="#534AB7" opacity="0.10"/>
  <!-- Outer hex border -->
  <polygon points="130,42 172,66 172,114 130,138 88,114 88,66"
           fill="none" stroke="#534AB7" stroke-width="1.8" opacity="0.55"/>
  <!-- Inner hex -->
  <polygon points="130,54 160,71 160,106 130,123 100,106 100,71"
           fill="none" stroke="#1D9E75" stroke-width="1" opacity="0.3"/>

  <!-- Mortarboard cap top -->
  <polygon points="130,65 158,77 130,89 102,77"
           fill="#534AB7" opacity="0.85"/>
  <polygon points="130,65 158,77 130,89 102,77"
           fill="none" stroke="#3C3489" stroke-width="1" opacity="0.6"/>

  <!-- Vertical stand -->
  <line x1="130" y1="89" x2="130" y2="110" stroke="#534AB7" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <!-- Left arm -->
  <line x1="130" y1="110" x2="112" y2="118" stroke="#534AB7" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Right arm -->
  <line x1="130" y1="110" x2="148" y2="118" stroke="#534AB7" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Tassel string -->
  <line x1="154" y1="77" x2="162" y2="95" stroke="#EF9F27" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <!-- Tassel bob -->
  <circle cx="162" cy="98" r="3.5" fill="#EF9F27" opacity="0.9"/>
  <line x1="157" y1="97" x2="167" y2="97" stroke="#EF9F27" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="158" y1="101" x2="166" y2="101" stroke="#EF9F27" stroke-width="1" stroke-linecap="round" opacity="0.5"/>

  <!-- Upward arrow -->
  <path d="M130 122 L124 116 M130 122 L136 116 M130 108 L130 122"
        fill="none" stroke="#1D9E75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- Corner dots -->
  <circle cx="88"  cy="114" r="2.5" fill="#EF9F27" opacity="0.5"/>
  <circle cx="130" cy="138" r="2.5" fill="#1D9E75" opacity="0.5"/>
  <circle cx="172" cy="114" r="2.5" fill="#534AB7" opacity="0.5"/>

  <!-- Wordmark: opraexam -->
  <text font-family="sans-serif" font-size="56" font-weight="500" letter-spacing="-0.5">
    <tspan x="212" y="118" fill="#3C3489">opra</tspan><tspan fill="#0F6E56">exam</tspan>
  </text>

  <!-- Underline accents -->
  <rect x="212" y="128" width="128" height="3" rx="1.5" fill="#534AB7" opacity="0.4"/>
  <rect x="344" y="128" width="144" height="3" rx="1.5" fill="#1D9E75" opacity="0.4"/>

  <!-- Tagline -->
  <text x="212" y="165" font-family="sans-serif" font-size="14" font-weight="400"
        fill="#888780" letter-spacing="1.2">Your ultimate guide</text>

</svg>
